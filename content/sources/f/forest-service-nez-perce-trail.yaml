notes: 'The route of the Nez Perce National Historic Trail (16 U.S.C. § 1244(a)(14)), the flight of the Nez Perce in 1877 from the Wallowa country of Oregon to the Bear Paw Mountains of Montana, drawn as 532 line pieces. The Forest Service says the layer "contains the public route of the Nez Perce National Historic Trail (NPNHT), the interim public route of the NPNHT, and researched historic trail locations related to the 1877 flight of the Nez Perce" and that it "could be an approximation and may not represent the exact location of the trail." Most of its length follows roads chosen as the public route near the historic one. The website''s "Forced journeys" tiles draw it without the pieces marked "Connector" or decommissioned (site/tools/build-historic-maps.mjs). The downloaded lines are kept in the project''s bucket under historic-maps/forest-service-nez-perce-trail/.'
