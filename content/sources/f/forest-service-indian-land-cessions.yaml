notes: 'The Forest Service scanned, georeferenced and traced all 67 of Royce''s (1899) map sheets into 718 cession shapes, each with Royce''s cession number, the cession dates, the map sheets it is drawn on and the present-day nations named in the Federal Register list of its day (layer 0 and table 2). The website draws the land cessions map layer from these shapes (site/tools/build-historic-maps.mjs) and links each cession to treaty records and nation pages with scripts/maps/land_cessions.py. The downloaded shapes and table are kept in the project''s bucket under historic-maps/forest-service-land-cessions/.'
