case_box:
  background: |-
    Under the Indian Self-Determination and Education Assistance Act of 1975, a Tribe may contract to run health programs that the Indian Health Service would otherwise run, receiving the funds the Service would have spent plus "contract support costs" for administration. A Tribe may also collect payments from Medicare, Medicaid and private insurers [@becerra-v-san-carlos-apache-tribe, pp. 226-227]. The San Carlos Apache Tribe, which took over health programs under a contract in 2011, and the Northern Arapaho Tribe sued for the support costs of spending that third-party income [@becerra-v-san-carlos-apache-tribe, p. 229].
  question: |-
    Must the Indian Health Service pay contract support costs that a Tribe incurs when it collects and spends third-party "program income" under an Indian Self-Determination and Education Assistance Act self-determination contract?
  holding: |-
    Yes. The Court held that the Indian Self-Determination and Education Assistance Act requires the Indian Health Service to pay contract support costs a Tribe incurs in spending program income to further the federal programs transferred to it under a self-determination contract.
  quotes:
  - text: "Because a self-determination contract requires a tribe to spend program income to further the programs transferred to it in the contract, these provisions require IHS to pay contract support costs when a tribe does so, just as IHS must pay contract support costs to support a tribe’s spending of the Secretarial amount."
    pinpoint: "p. 233"
  topics:
  - "Dispute resolution and arbitration"
  reading:
    title: "*Becerra v. San Carlos Apache Tribe* (2024)"
    text: |-
      The only Indian-law merits decision of October Terms 2023-2025. It arose from contract disputes under the Indian Self-Determination and Education Assistance Act.
