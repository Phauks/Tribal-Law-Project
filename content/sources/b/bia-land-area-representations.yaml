notes: 'Three layers from the Bureau''s Division of Land Titles and Records: the national land area representations (reservations and associated trust, restricted fee and mixed ownership land, from the Bureau''s land title records), the Oklahoma Tribal Statistical Areas drawn from 1867-1870 descriptions, and the supplemental areas. They show today''s areas only; the Bureau publishes no past years. The Bureau calls them "strictly for illustrative and reference purposes" and says "No legal inference can or should be made from the information in this GIS Dataset." Kept in the project''s bucket under historic-maps/bia-land-areas/ as GeoJSON (site/tools/collect-historic-maps.mjs); not yet drawn on the website''s map.'
