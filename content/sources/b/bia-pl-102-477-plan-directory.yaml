notes: 'The two public map services behind the Bureau''s 477 Plan Directory (https://www.bia.gov/bia/ois/dwd/477Initiative/477PlanDirectory): PL102_477_Contracts, one row per plan with its organization type, agreement type, region and plan dates (84 plans on Nov. 26, 2026), and PL102_477_PartnerEnrollment (https://biamaps.geoplatform.gov/server/rest/services/Hosted/PL102_477_PartnerEnrollment/FeatureServer/0), one row per federal program merged into a plan (686 rows). The services also hold names, titles and email addresses of Tribal and federal officials; those fields were never read into the project (charter, commitment 1), so no copy of the raw responses is kept. The plan and program fields are in research/self-governance/2026-11-26/.'
