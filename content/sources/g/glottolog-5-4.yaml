notes: 'The catalog of the world''s languages, families and dialects, with a bibliography of descriptions. The language registry (content/languages/, scripts/languages/build_registry.py) takes from it each language''s Glottocode, family, dialects, the name Lexvo gives the language in the language itself, the Endangered Languages Project link, and the grammars and dictionaries Glottolog lists for the language. The CLDF release is at https://zenodo.org/records/24101243.'
