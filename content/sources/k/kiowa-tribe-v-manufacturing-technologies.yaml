case_box:
  background: |-
    In 1990 a Kiowa Tribe entity agreed to buy stock from Manufacturing Technologies, and the chairman of the Tribe's business committee signed a $285,000 promissory note in the Tribe's name. The note said it was signed on Tribal trust land at Carnegie, Oklahoma, though the company said it was signed and delivered in Oklahoma City. The Tribe defaulted, and the company sued on the note in state court [@kiowa-tribe-v-manufacturing-technologies, pp. 753-754].
  question: |-
    Does Tribal sovereign immunity bar a state-court suit on a promissory note signed for off-reservation commercial activity?
  holding: |-
    Yes. The Court held that Tribes enjoy immunity from suits on contracts, whether governmental or commercial and whether made on or off a reservation, unless Congress has authorized the suit or the Tribe has waived immunity. It left any narrowing of the doctrine to Congress.
  quotes:
  - text: "As a matter of federal law, an Indian tribe is subject to suit only where Congress has authorized the suit or the tribe has waived its immunity."
    pinpoint: "p. 754"
  - text: "Tribes enjoy immunity from suits on contracts, whether those contracts involve governmental or commercial activities and whether they were made on or off a reservation."
    pinpoint: "p. 760"
  - text: "There are reasons to doubt the wisdom of perpetuating the doctrine."
    pinpoint: "p. 758"
  treatment: |-
    Reaffirmed in *Michigan v. Bay Mills Indian Community* (2014). [@michigan-v-bay-mills-indian-community]
