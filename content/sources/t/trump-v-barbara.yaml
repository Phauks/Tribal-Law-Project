notes: 'Indigo Book citation: Trump v. Barbara, 609 U.S. 719 (2026). Official report: the Court''s preliminary print of volume 609, part 2 (pp. 719-907): https://www.supremecourt.gov/opinions/25pdf/609us2r66_o7kq.pdf. No Native nation or person is a party. The case is listed because it affects Native people: the opinions explain the Citizenship Clause''s exception for children born members of Indian tribes, and the Court reads Elk v. Wilkins, 112 U.S. 94 (1884), as concerning "only members of Indian tribes within the United States" (p. 747 n.5, quoting United States v. Wong Kim Ark, 169 U.S. 649, 682 (1898)). Written by hand from the preliminary print; not in the Supreme Court Database''s 2026_01 release; not yet read by a person.'
