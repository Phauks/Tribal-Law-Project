case_box:
  background: |-
    In 1993 the Citizen Potawatomi Nation contracted with C & L Enterprises to roof a building it owned in Shawnee, Oklahoma, on land that was neither reservation nor trust land. The Nation proposed the contract, a standard American Institute of Architects form with an arbitration clause [@c-and-l-enterprises-v-citizen-band-potawatomi-2001, pp. 414-415]. Before work began, the Nation changed the roofing material and hired another company. C & L obtained an arbitration award, the Nation declining to take part, and sued in Oklahoma state court to enforce it [@c-and-l-enterprises-v-citizen-band-potawatomi-2001, p. 416].
  question: |-
    Did the Nation waive its sovereign immunity from suit to enforce an arbitration award by agreeing to a standard-form construction contract with an arbitration clause and an Oklahoma choice-of-law clause?
  holding: |-
    Yes. The Court held that the Nation clearly waived immunity from a state-court suit to enforce the award. It did so by agreeing to arbitrate all contract disputes, to have judgment entered on the award in any court having jurisdiction, and to have Oklahoma law govern (which makes Oklahoma courts competent to enforce arbitration agreements). It noted that the Nation itself proposed and prepared the contract.
  quotes:
  - text: "We hold that, by the clear import of the arbitration clause, the Tribe is amenable to a state-court suit to enforce an arbitral award in favor of contractor C & L."
    pinpoint: "p. 414"
  - text: "[T]he contract specifically authorizes judicial enforcement of the resolution arrived at through arbitration."
    pinpoint: "p. 422"
  - text: "The Tribe proposed and prepared the contract; C & L foisted no form on a quiescent Tribe."
    pinpoint: "p. 423"
  treatment: |-
    Cited in *Michigan v. Bay Mills Indian Community* (2014) for the rule that a Tribe may waive immunity by contract. [@michigan-v-bay-mills-indian-community]
  topics:
  - "Dispute resolution and arbitration"
  - "Enforcement of awards, orders and judgments"
  - "Sovereign immunity"
  reading:
    title: "*C & L Enterprises, Inc. v. Citizen Band Potawatomi Indian Tribe of Oklahoma* (2001)"
    text: |-
      An arbitration clause plus enforcement and choice-of-law language can waive immunity for enforcement of awards.
