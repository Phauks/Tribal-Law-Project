notes: 'One national file for each year the Census Bureau published: the 1990 cartographic boundary file (PREVGENZ/aianhh/ir/ir99_d90_shp.zip), the 2000 file (TIGER2010/AIANNH/2000), the 2007 to 2009 national files and the 2010 to 2026 TIGER/Line files. The website''s map year slider draws them from one tile set in which each shape carries the years the Bureau drew it so (site/tools/build-historic-maps.mjs). These are statistical areas, not legal boundaries; landless nations have none. The 22 files are kept in the project''s bucket under historic-maps/census-land-areas/.'
