notes: 'Tables B01003, B02001, B02010, B01002, B19013, B17001, B23025, B15003 and B28002 for the 704 areas at summary level 250 (geographic component 00), read by scripts/tribes/acs_native_areas.py into research/census/acs-2020-2024-native-areas.csv, which the table builder''s "Census areas" dataset shows. Used because api.census.gov refuses the api.data.gov key (it wants a Census key of its own) and redirects keyless requests to a missing-key page. Estimates with margins of error; rates are worked out from the counts. The figures describe everyone living in an area, Native or not, and are not counts of any nation''s citizens.'
