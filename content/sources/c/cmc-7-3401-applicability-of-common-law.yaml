notes: 'Read on the CNMI Law Revision Commission site on Nov. 22, 2026. Source: 1 TTC § 103. Makes the common law the rule of decision "in the absence of written law or local customary law to the contrary." No CNMI statute setting up a customary dispute body or process was found in this search (not proof of absence).'
