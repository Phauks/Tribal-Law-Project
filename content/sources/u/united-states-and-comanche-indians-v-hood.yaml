notes: 'Full citation: United States and Comanche Indians v. Hood, 172 U.S. 641 (1898) (mem.). Official report: the decisions announced without opinions at the back of volume 172, pp. 641-642, in GovInfo''s scan of the volume (https://www.govinfo.gov/content/pkg/USREPORTS-172/pdf/USREPORTS-172-BackMatter-2.pdf, PDF page 1); the Library of Congress has no scan of this section. An appeal by the United States and the Comanche Indians from a judgment of the Court of Claims, affirmed by an equally divided Court without opinion. The report names counsel: Mr. Attorney General, Mr. Assistant Attorney General Thompson and Mr. Charles W. Russell for appellants; Mr. William B. King, Mr. Silas Hare and Mr. John W. Clark for appellee. Not yet read by a person.'
