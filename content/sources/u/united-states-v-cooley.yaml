case_box:
  background: |-
    Late one night in February 2016, Officer James Saylor of the Crow Police Department stopped to check on a truck parked on U.S. Highway 212, a public right-of-way within the Crow Reservation in Montana. The driver, Joshua James Cooley, appeared to be non-Native. Saylor detained him, saw methamphetamine in the truck and held him for other officers, and a federal grand jury indicted Cooley on drug and gun charges. He moved to suppress the evidence, arguing that a Tribal officer had no authority over a non-Indian on the highway [@united-states-v-cooley, pp. 348-349].
  question: |-
    May a Tribal police officer temporarily detain and search a non-Indian on a public right-of-way within a reservation for apparent violations of state or federal law?
  holding: |-
    Yes. The Court held that under *Montana*'s second exception a Tribe retains inherent authority to detain and search non-Indians on such rights-of-way for a reasonable time. That authority applies when the officer has reason to believe the person may commit or has committed a crime. It vacated the Ninth Circuit judgment affirming suppression and remanded.
  quotes:
  - text: "To deny a tribal police officer authority to search and detain for a reasonable time any person he or she believes may commit or has committed a crime would make it difficult for tribes to protect themselves against ongoing threats."
    pinpoint: "p. 350-351"
  topics:
  - "Criminal jurisdiction"
  reading:
    title: "*United States v. Cooley* (2021)"
    text: |-
      First modern Supreme Court application of *Montana*'s second exception in favor of Tribal authority.
subjects: [criminal, jurisdiction]
