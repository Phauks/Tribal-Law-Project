case_box:
  background: |-
    In 2005 Congress responded to high rates of domestic violence against Native women. It made domestic assault in Indian country a federal crime for anyone with at least two prior domestic violence convictions in federal, state or Tribal court [@united-states-v-bryant, pp. 142-143]. Michael Bryant Jr., a Northern Cheyenne member, had more than 100 Tribal-court convictions, several of them for domestic assault. He had no appointed lawyer in those cases, as the Indian Civil Rights Act permits for sentences of up to a year [@united-states-v-bryant, pp. 143, 151].
  question: |-
    May uncounseled Tribal-court misdemeanor convictions that complied with the Indian Civil Rights Act serve as predicates for the federal habitual domestic-assault offense, 18 U.S.C. § 117(a)?
  holding: |-
    Yes. The Court held that because the Sixth Amendment does not apply in Tribal courts and Bryant's convictions complied with the Indian Civil Rights Act, they were valid when entered and their use as predicates does not violate the Constitution.
  quotes:
  - text: "Because Bryant's tribal-court convictions occurred in proceedings that complied with ICRA and were therefore valid when entered, use of those convictions as predicate offenses in a § 117(a) prosecution does not violate the Constitution."
    pinpoint: "p. 157"
  topics:
  - "Recognition of Tribal judgments (comity)"
  - "Enforcement of awards, orders and judgments"
  - "Tribal courts"
  - "Criminal jurisdiction"
  reading:
    title: "*United States v. Bryant* (2016)"
    text: |-
      Federal law gives effect to Tribal-court judgments that comply with the Indian Civil Rights Act.
