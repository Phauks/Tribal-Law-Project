notes: Listed by the Environmental Protection Agency under "Tribal Standards in Effect for CWA Purposes" on its page for the nation (https://www.epa.gov/wqs-tech/water-quality-standards-regulations-miccosukee-tribe-indians-florida). EPA's page gives it as effective June 14, 2021. The nation was found eligible to set water quality standards (Clean Water Act § 518(e)) on 1994-12-20 2001-3-15 [Supplemental Application] 2020-9-30 [Second Supplemental Application], and EPA first approved its standards on 1999-05-25 2001-03-15 (Miccosukee Reserve Area). EPA notes that parts of a document may be disapproved or not in effect for Clean Water Act purposes; its page says which. Generated by scripts/law/approved_nation_laws.py; the nation was matched by name, and nobody has checked the record against the document yet (Unverified).
