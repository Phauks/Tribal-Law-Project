notes: Listed by the Environmental Protection Agency under "Tribal Standards in Effect for CWA Purposes" on its page for the nation (https://www.epa.gov/wqs-tech/water-quality-standards-regulations-navajo-nation). EPA's page gives it as effective Mar. 17, 2021. The nation was found eligible to set water quality standards (Clean Water Act § 518(e)) on 2006-01-20 2019-05-23 [Supplemental application], and EPA first approved its standards on 2006-04-11. EPA notes that parts of a document may be disapproved or not in effect for Clean Water Act purposes; its page says which. Generated by scripts/law/approved_nation_laws.py; the nation was matched by name, and nobody has checked the record against the document yet (Unverified).
