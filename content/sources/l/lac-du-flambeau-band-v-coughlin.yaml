case_box:
  background: |-
    The Lac du Flambeau Band of Lake Superior Chippewa Indians owns several businesses, including Lendgreen, which in 2019 lent Brian Coughlin $1,100 at high interest. Coughlin filed for Chapter 13 bankruptcy before repaying, which barred further collection, but Lendgreen allegedly kept trying to collect. Coughlin asked the bankruptcy court to enforce the stay against the Band and its businesses and award damages, and the Band asserted sovereign immunity [@lac-du-flambeau-band-v-coughlin, pp. 385-386].
  question: |-
    Does the Bankruptcy Code abrogate Tribal sovereign immunity?
  holding: |-
    Yes. The Court held that the Bankruptcy Code's abrogation for "governmental units," including any "other foreign or domestic government," unequivocally covers federally recognized Tribes, so a debtor could pursue the Band's lending business for violating the automatic stay.
  quotes:
  - text: "The Code unequivocally abrogates the sovereign immunity of all governments, categorically. Tribes are indisputably governments. Therefore, § 106(a) unmistakably abrogates their sovereign immunity too."
    pinpoint: "p. 393"
  - text: "Federally recognized tribes undeniably fit that description . . . ."
    pinpoint: "p. 388"
  topics:
  - "Enforcement of awards, orders and judgments"
  - "Sovereign immunity"
  reading:
    title: "*Lac du Flambeau Band of Lake Superior Chippewa Indians v. Coughlin* (2023)"
    text: |-
      A congressional abrogation that applies to Tribal enterprises in bankruptcy regardless of contract language.
subjects: [sovereign-immunity]
