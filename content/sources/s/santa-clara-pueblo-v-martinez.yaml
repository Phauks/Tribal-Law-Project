case_box:
  background: |-
    A Santa Clara Pueblo ordinance of 1939 denied membership to the children of women members who married outside the Pueblo, while admitting the children of men members who did. Julia Martinez, a member who in 1941 married a Navajo man, and her daughter Audrey sued the Pueblo and its governor in federal court [@santa-clara-pueblo-v-martinez, pp. 51-52]. They relied on Title I of the Indian Civil Rights Act of 1968. It forbids a Tribe to deny any person "the equal protection of its laws" but does not say who may sue to enforce it [@santa-clara-pueblo-v-martinez, p. 51; @indian-civil-rights-act-1968].
  question: |-
    Does the Indian Civil Rights Act authorize a federal civil action against a Pueblo and its officer to challenge a membership ordinance as sex discrimination?
  holding: |-
    No. The Court held that the Pueblo's sovereign immunity bars suit against it under the Indian Civil Rights Act. The Indian Civil Rights Act also creates no implied federal cause of action against Tribal officers beyond habeas corpus. Its rights are to be enforced in Tribal forums, including nonjudicial ones.
  quotes:
  - text: "As separate sovereigns pre-existing the Constitution, tribes have historically been regarded as unconstrained by those constitutional provisions framed specifically as limitations on federal or state authority."
    pinpoint: "p. 56"
  - text: "Tribal courts have repeatedly been recognized as appropriate forums for the exclusive adjudication of disputes affecting important personal and property interests of both Indians and non-Indians."
    pinpoint: "p. 65"
  - text: "Nonjudicial tribal institutions have also been recognized as competent law-applying bodies."
    pinpoint: "p. 66"
  - text: "A tribe's right to define its own membership for tribal purposes has long been recognized as central to its existence as an independent political community."
    pinpoint: "p. 72 n.32"
  topics:
  - "Dispute resolution and arbitration"
  - "Sovereign immunity"
  - "Tribal courts"
  reading:
    title: "*Santa Clara Pueblo v. Martinez* (1978)"
    text: |-
      Recognizes Tribal courts and nonjudicial Tribal institutions as competent forums for enforcing civil rights and resolving disputes, and leaves the Indian Civil Rights Act enforcement (except habeas) to them.
