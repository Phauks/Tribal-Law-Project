case_box:
  background: |-
    In November 1990 Gisela Fredericks's car collided with a gravel truck driven by Lyle Stockert for A-1 Contractors on a 6.59-mile stretch of North Dakota highway crossing the Fort Berthold Indian Reservation. The road ran on a right-of-way the United States had granted to the state. Stockert and A-1 Contractors were not members of the Three Affiliated Tribes (Mandan, Hidatsa and Arikara), and Fredericks sued them in the Tribes' court [@strate-v-a-1-contractors, pp. 442-443].
  question: |-
    Does a Tribal court have jurisdiction over a tort suit between nonmembers arising from a highway accident on a state right-of-way within the reservation?
  holding: |-
    No. The Court held that a Tribe's adjudicative jurisdiction over nonmembers does not exceed its legislative jurisdiction. The state highway right-of-way is equivalent to non-Indian fee land for *Montana* purposes, and neither *Montana* exception applied. Exhaustion was not required because Tribal jurisdiction was plainly lacking.
  quotes:
  - text: "As to nonmembers, we hold, a tribe's adjudicative jurisdiction does not exceed its legislative jurisdiction."
    pinpoint: "p. 453"
  - text: "Opening the Tribal Court for her optional use is not necessary to protect tribal self-government . . . ."
    pinpoint: "p. 459"
  treatment: |-
    Applied in *Nevada v. Hicks* (2001) and *Plains Commerce Bank* (2008). [@nevada-v-hicks]
  topics:
  - "Exhaustion of Tribal remedies"
  - "Tribal courts"
  - "Civil jurisdiction"
  reading:
    title: "*Strate v. A-1 Contractors* (1997)"
    text: |-
      Limits Tribal adjudication of disputes between nonmembers absent consent.
