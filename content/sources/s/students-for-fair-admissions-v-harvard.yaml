notes: 'Indigo Book citation: Students for Fair Admissions, Inc. v. President & Fellows of Harvard Coll., 600 U.S. 181 (2023). Decided with No. 21–707, Students for Fair Admissions, Inc. v. University of North Carolina. Official report: the Court''s preliminary print of volume 600, part 1 (pp. 181-411): https://www.supremecourt.gov/opinions/22pdf/600us1r53_4g15.pdf. No Native nation or person is a party. The case is listed because the admissions programs it holds unlawful counted Native American applicants among the groups they covered: Harvard reported its classes in categories including "Native American" (p. 216), and UNC''s underrepresented minority candidates included those identifying as "American Indian or Alaska Native" (p. 296, Gorsuch, J., concurring). Written by hand from the preliminary print; not yet read by a person.'
