annotation: >-
  Hall Street (No. 06-989, argued Nov. 7, 2007, decided Mar. 25, 2008) held that
  the FAA's §§ 10–11 grounds are exclusive for parties seeking expedited review under
  the FAA, so parties cannot contractually expand judicial review for legal error
  under the Act; the syllabus adds that the Court "decides nothing about other possible
  avenues for judicial enforcement of awards" (Held 2). The opinion holds "that §§
  10 and 11 respectively provide the FAA's exclusive grounds for expedited vacatur
  and modification" (552 U.S. at 584, 128 S. Ct. at 1403) but does "not purport to
  say that they exclude more searching review based on authority outside the statute
  as well," such as "state statutory or common law" (id. at 590, 128 S. Ct. at 1406). (project analysis) Relevant to whether a Tribal code should let parties
  opt into broader Tribal-court review of awards, a choice that federal law forecloses
  under the FAA but that a separate Tribal statute could permit for Tribal-court
  enforcement.
