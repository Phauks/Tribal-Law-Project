case_box:
  background: |-
    The Indian Child Welfare Act sets federal standards for removing Indian children from their families and preferences for placing them with extended family, other members of their Tribe or other Indian families. The Brackeens fostered A.L.M., a child eligible for Navajo and Cherokee citizenship, and sought to adopt him, while the Navajo Nation proposed a Navajo family in New Mexico. The Brackeens, other foster and adoptive parents, a birth mother and Texas sued the United States, arguing that the Act exceeded Congress's power, commandeered the States and discriminated by race [@haaland-v-brackeen, pp. 264-271].
  question: |-
    Is the Indian Child Welfare Act within Congress's power and consistent with the anticommandeering principle and equal protection?
  holding: |-
    The Court rejected the Article I and anticommandeering challenges to the Indian Child Welfare Act on the merits and held that the individual petitioners and Texas lacked standing to raise the equal-protection and nondelegation challenges.
  quotes:
  - text: "Our cases leave little doubt that Congress’s power in this field is muscular, superseding both tribal and state authority."
    pinpoint: "p. 273"
  - text: "But the bottom line is that we reject all of petitioners’ challenges to the statute, some on the merits and others for lack of standing."
    pinpoint: "p. 264"
  topics:
  - "Child welfare"
  reading:
    title: "*Haaland v. Brackeen* (2023)"
    text: |-
      Upholds the Indian Child Welfare Act, including the role of Tribal courts and Tribal placement preferences.
