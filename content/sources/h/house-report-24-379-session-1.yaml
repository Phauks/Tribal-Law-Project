  title: Missouri -- extension of western boundary. (To accompany Bill H.R. No. 381.) House of Representatives, February 12, 1836. On motion of Mr. Ashley, Resolved, that the Committee on Indian Affairs be instructed to inquire whether the Indian title is or is not extinguished to the slip of land lying between the western boundary of the State of Missouri and the Missouri River, and if not to inquire into the expediency of providing by law for its entire extinguishment
