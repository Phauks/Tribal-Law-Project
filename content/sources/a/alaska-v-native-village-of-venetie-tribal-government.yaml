case_box:
  background: |-
    In 1943 the Secretary of the Interior created a reservation for the Neets'aii Gwich'in around Venetie and Arctic Village in Alaska. The Alaska Native Claims Settlement Act of 1971 revoked it, and the land passed in fee simple to Native corporations and then to the Native Village of Venetie Tribal Government [@alaska-v-native-village-of-venetie-tribal-government, pp. 523-524]. In 1986 the Tribe demanded about $161,000 in taxes from a contractor building a state-funded school in Venetie and, when the contractor and the State refused, sued in Tribal court to collect [@alaska-v-native-village-of-venetie-tribal-government, p. 525].
  question: |-
    Are lands conveyed to Alaska Native village corporations under the Alaska Native Claims Settlement Act "Indian country" as a "dependent Indian community" under 18 U.S.C. § 1151(b)?
  holding: |-
    No. The Court held that a dependent Indian community requires federal set-aside and federal superintendence. The Alaska Native Claims Settlement Act lands meet neither, because the Alaska Native Claims Settlement Act revoked reservations and conveyed land to state-chartered corporations. Venetie therefore could not tax a contractor on those lands as Indian country.
  quotes:
  - text: "Equally clearly, ANCSA ended federal superintendence over the Tribe's lands."
    pinpoint: "p. 533"
  - text: "Whether the concept of Indian country should be modified is a question entirely for Congress."
    pinpoint: "p. 534"
  treatment: |-
    The Alaska Supreme Court in *John v. Baker* (1999) held that Alaska Native Tribes retain non-territorial jurisdiction over members' domestic disputes despite *Venetie*. [@john-v-baker]
  topics:
  - "Civil jurisdiction"
  reading:
    title: "*Alaska v. Native Village of Venetie Tribal Government* (1998)"
    text: |-
      Central for Alaska Native nations. Territorial (Indian country) jurisdiction is largely unavailable on the Alaska Native Claims Settlement Act lands, so Alaska Tribal courts rely on membership-based jurisdiction and consent.
subjects: [jurisdiction, land, taxation]
