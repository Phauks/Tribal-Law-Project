case_box:
  background: |-
    In 1916 Hubert Richardson built the Cameron Trading Post near Cameron, Arizona, on land that is now non-Indian fee land within the Navajo Reservation; Atkinson Trading Company now owns it and runs a hotel there. In 1992 the Navajo Nation enacted an 8 percent hotel occupancy tax on hotel rooms within the reservation, paid by guests and collected by owners. Atkinson challenged the tax as applied to its nonmember guests [@atkinson-trading-company-v-shirley, pp. 647-648].
  question: |-
    May the Navajo Nation impose a hotel occupancy tax on nonmember guests of a hotel on non-Indian fee land within the reservation?
  holding: |-
    No. The Court held that *Montana*'s general rule governs Tribal taxation of nonmember activity on non-Indian fee land, that the guests' receipt of Tribal services did not create a consensual relationship, and that the second *Montana* exception did not apply.
  quotes:
  - text: "An Indian tribe's sovereign power to tax-whatever its derivation-reaches no further than tribal land."
    pinpoint: "p. 653"
  - text: "[A] nonmember's actual or potential receipt of tribal police, fire, and medical services does not create the requisite connection."
    pinpoint: "p. 655"
  topics:
  - "Civil jurisdiction"
  reading:
    title: "*Atkinson Trading Co. v. Shirley* (2001)"
    text: |-
      Shows that services alone do not create consent.
subjects: [jurisdiction, taxation]
