annotation: >-
  Concepcion (No. 09-893, decided Apr. 27, 2011) held that California's Discover
  Bank rule, which treated class waivers in consumer arbitration agreements as unconscionable,
  is preempted by the FAA. The Court read § 2's saving clause to permit invalidation
  by "generally applicable contract defenses, such as fraud, duress, or unconscionability,"
  but not by defenses that apply only to arbitration (563 U.S. at 339, 131 S. Ct.
  at 1746). Although the saving clause preserves those defenses, "nothing in it suggests
  an intent to preserve state-law rules that stand as an obstacle to the accomplishment
  of the FAA's objectives" (id. at 343, 131 S. Ct. at 1748), and "[r]equiring the
  availability of classwide arbitration interferes with fundamental attributes of
  arbitration" (id. at 344, 131 S. Ct. at 1748). (project analysis) Important for
  drafting any Tribal consumer- or employment-protection limits on arbitration: rules
  that single out arbitration are the ones most exposed to an FAA preemption challenge
  in non-Tribal forums.
