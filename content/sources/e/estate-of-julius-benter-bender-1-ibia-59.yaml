notes: 'Indigo Book citation: Estate of Julius Benter (Bender), 1 IBIA 59 (1971). Decision of the Interior Board of Indian Appeals, listed in the Board''s chronological index. Name from the decision''s cover sheet; date (January 12, 1971) from the decision''s own date. Cover sheet notes: Denying reconsideration of: 1 IBIA 24; Judicial review of this case: Dismissed, No. 71-1559 (9th Cir. Feb. 18, 1972) Dismissed upon stipulation, Brazie v. Morton, No. S-2360 (E.D. Cal. Dec. 28, 1972); Related Board cases: 15 IBIA 88; 17 IBIA 86 Estate of Julius Benter Decided January 12, 1971 Syllabus IBIA 70-5 Supp. Indian Lands: Descent and Distribution: Appeals Although 25 CFR 15 does not include any provision for rehearing after decision on appeal, the Board has inherent power to rectify manifest error. Indian Lands: Descent and Distribution: Appeals A rehearing after entry of a decision on appeal will not be granted except upon a showing of manifest error in such decision. Indian Lands: Descent and Distribution: Appeals: Departmental Decisions Under the delegation of authority by the Secretary to the Director of the Office of Hearings and Appeals, 35 F.R. 12081 (July 28, 1970), a decision by the Board of Indian Appeals becomes a Departmental decision, and upon the issuance of such decision the parties have exhausted their administrative remedies. 1 IBIA 59. Generated by scripts/law/ibia_decisions.py, with the nations matched by name in the decision''s name; not yet read by a person (Unverified).'
