notes: >-
  The website's globe draws the 6,211 stars brighter than magnitude 6.2 behind the earth (site/static/map-sky/stars.json, written by site/tools/fetch-globe-stars.mjs): each star's position, V magnitude and B-V color only. The Yale Bright Star Catalog was not used, because NASA HEASARC says it offers that catalog for research only and that Yale or its authors may still hold its copyright.
