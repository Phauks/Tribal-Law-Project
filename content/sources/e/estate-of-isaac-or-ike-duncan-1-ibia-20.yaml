notes: 'Indigo Book citation: Estate of Isaac or Ike Duncan, 1 IBIA 20 (1970). Decision of the Interior Board of Indian Appeals, listed in the Board''s chronological index. Name from the decision''s cover sheet; date (November 2, 1970) from the Board''s cover sheet and index, which agree. Cover sheet notes: NOTICE OF ESCHEAT In the matter of the Estate of Isaac or Ike Duncan, R&R Allottee No. 16, deceased : November 2, 1970; : : Notice is hereby given that by order of November 3, 1970, attached hereto and made a part of this notice, the Secretary of the Interior, through his duly authorized representative and pursuant to Section 2 of the Act of November 24, 1942 (56 Stat. 1022, 25 U.S.C. 373(b)), has directed that available cash, and trust or restricted interests in public domain allotments, described more fully in the attached order, of the Estate of Isaac or Ike Duncan, R&R Allottee No. 16, deceased Hoopa Indian, escheat to the United States. //original signed David J. McKee Chairman, Board of Indian Appeals 1 IBIA 20. Generated by scripts/law/ibia_decisions.py, with the nations matched by name in the decision''s name; not yet read by a person (Unverified).'
