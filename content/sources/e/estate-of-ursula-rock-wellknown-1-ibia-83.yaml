notes: 'Indigo Book citation: Estate of Ursula Rock Wellknown, 1 IBIA 83 (1971). Decision of the Interior Board of Indian Appeals, listed in the Board''s chronological index. Name from the decision''s cover sheet; date (May 21, 1971) from the decision''s own date. Cover sheet notes: Also published at 78 Interior Decisions 179; Judicial review of this case: Dismissed, Shaw v. Morton, Civil No. 974 (D. Mont. July 6, 1973) Estate of Mary Ursula Rock Wellknown Decided May 21, 1971 IBIA 70-7 Indian Probate: Wills: Disapproval of Will The Secretary is authorized to exercise his discretion in disapproving a devise in the will of a deceased Indian where approval of such devise would sanction a practice permitting the acquisition of Indian lands contrary to the public policy expressed in the statutory restrictions against the alienation of Indian lands held in trust. Indian Probate: Evidence: Generally--Indian Probate: Wills: Applicability of State Law Indian probate proceedings involve considerations which go beyond the conventional issues of a state probate proceeding and evidence may be admitted in an Indian probate proceeding which would not be relevant to the probate of a will in a state proceeding. 1 IBIA 83. Generated by scripts/law/ibia_decisions.py, with the nations matched by name in the decision''s name; not yet read by a person (Unverified).'
