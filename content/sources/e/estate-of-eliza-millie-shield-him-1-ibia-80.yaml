notes: 'Indigo Book citation: Estate of Eliza (Millie) Shield Him, 1 IBIA 80 (1971). Decision of the Interior Board of Indian Appeals, listed in the Board''s chronological index. Name from the decision''s cover sheet; date (March 24, 1971) from the decision''s own date. Cover sheet notes: Estate of Eliza Shield Him IBIA 71-7 Decided March 24, 1971 Syllabus Indian Probate: Reopening: Generally A petition for reopening must comply in form and substance to the requirements of § 15.18 of 25 C.F.R. Indian Probate: Reopening: Generally When a petition for reopening is filed with the Examiner more than three years after the entry of the final decision in a probate, the petition is properly referred to the Board of Indian Appeals for disposition. Indian Probate: Reopening: Waiver of time limitation The Board of Indian Appeals, acting under delegated authority from the Secretary will not exercise discretion retained by the Secretary to waive time limitations without proper showing of merit in the petition. Indian Probate: Appeal: Dismissal An imperfect appeal will be dismissed with prejudice upon appellant''s petition to withdraw the petition. 1 IBIA 80. Generated by scripts/law/ibia_decisions.py, with the nations matched by name in the decision''s name; not yet read by a person (Unverified).'
