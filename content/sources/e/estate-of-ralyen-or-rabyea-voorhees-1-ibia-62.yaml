notes: 'Indigo Book citation: Estate of Ralyen or Rabyea Voorhees, 1 IBIA 62 (1971). Decision of the Interior Board of Indian Appeals, listed in the Board''s chronological index. Name from the decision''s cover sheet; date (February 12, 1971) from the decision''s own date. Cover sheet notes: Estate of Ralyen or Rabyea Voorhees Decided February 12, 1971 IBIA 70-3 (Supp.) Indian Probate: Rehearing: Generally A petition for rehearing which fails to conform to the requirements of the regulations in either form or substance is properly denied. Indian Probate: Rehearing: Pleading, Timely filing A petition for rehearing must be physically delivered to the Superintendent on or before midnight of the sixtieth day following the Examiner''s issuance and mailing of the final order in a probate if the same is to be treated as timely filed. Indian Probate: Appeal: Timely filing When it appears an appeal is based upon a petition for rehearing void as not timely filed, the Examiner''s order denying such petition will be affirmed. 1 IBIA 62. Generated by scripts/law/ibia_decisions.py, with the nations matched by name in the decision''s name; not yet read by a person (Unverified).'
