notes: 'Indigo Book citation: Estate of Loretta Pederson, 1 IBIA 14 (1970). Decision of the Interior Board of Indian Appeals, listed in the Board''s chronological index. Name from the decision''s cover sheet; date (October 6, 1970) from the decision''s own date. Cover sheet notes: Also published at 77 Interior Decisions 270 Estate of Loretta Pederson Decided October 6, 1970 State Law Applicability to Indian Probate: Generally A state law which provides that a child who is not named or provided for in the will of his parent shall take as if the testator died intestate, is not applicable to Indian wills. Wills Failure to mention child A state law providing that a child shall take as if the parent died intestate if the child is not named or provided for in his will does not apply to Indian wills executed pursuant to 25 U.S.C. 373. 1 IBIA 14. Generated by scripts/law/ibia_decisions.py, with the nations matched by name in the decision''s name; not yet read by a person (Unverified).'
