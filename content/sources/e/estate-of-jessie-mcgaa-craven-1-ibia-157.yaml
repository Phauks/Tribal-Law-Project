notes: 'Indigo Book citation: Estate of Jessie McGaa Craven, 1 IBIA 157 (1971). Decision of the Interior Board of Indian Appeals, listed in the Board''s chronological index. Name from the decision''s cover sheet; date (October 8, 1971) from the decision''s own date. Cover sheet notes: ESTATE OF JESSIE McGAA CRAVEN Decided October 8, 1971 IBIA 71-9 Syllabus Indian Probate: Appeal: Generally Pleadings on appeal which are not timely filed may be stricken. Indian Probate: Appeal: Matters Considered on Appeal An issue which has not been submitted to the Examiner in the petition for rehearing will not be considered on appeal. Indian Probate: Compromise Settlements: Generally A "Family Agreement" which constitutes a compromise settlement diverting distribution of the estate from the pattern required by the statutes or by the decedent''s will is not to be considered except upon the unanimous consent of all the parties to the agreement. Indian Probate: Wills: Construction of When the intent of the testator is clear from the record as a whole, technical defects in the writing such as a scrivener''s erroneous reference to a date shall not defeat such intent. 1 IBIA 157. Generated by scripts/law/ibia_decisions.py, with the nations matched by name in the decision''s name; not yet read by a person (Unverified).'
