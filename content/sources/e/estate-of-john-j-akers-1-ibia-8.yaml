notes: 'Indigo Book citation: Estate of John J. Akers, 1 IBIA 8 (1970). Decision of the Interior Board of Indian Appeals, listed in the Board''s chronological index. Name from the decision''s cover sheet; date (September 9, 1970) from the decision''s own date. Cover sheet notes: Also published at 77 Interior Decisions 268; Judicial review of this case: Affirmed, Akers v. Morton, 333 F.Supp. 184 (D. Mont. 1971); Related cases prior to this case: Consent judgment, Estate of John Akers, Deceased v. Commissioner of Internal Revenue, Tax Court Docket No. 61338 (May 25, 1964) Interior Probate IA-D-18 (1968) Interior Probate IA-D-18 (Supp.) (1968); Related Board cases: 1 IBIA 246 Dismissed for failure to prosecute, No. 71-3002 (9th Cir. May 3, 1972) Reinstated and affirmed, 499 F.2d 44 (9th Cir. 1974) Certiorari denied, 423 U.S. 831 (1975) 3 IBIA 300 Estate of John J. Akers Decided September 9, 1970 IBIA 70-4 Dower Dower: General Wills Applicability of State Law When an Indian dies leaving a will made pursuant to 25 U.S.C. 373, which meets Secretarial approval, State laws pertaining to dower or curtesy rights are not applicable and do not affect the manner in which he devises his trust property. Appeal Final decision: Generally When the Board of Indian Appeals determines that the legal interpretation of a probate case is correct and that the case has been properly conducted, decided and reviewed, its decision is the final decision of the Department. Generated by scripts/law/ibia_decisions.py, with the nations matched by name in the decision''s name; not yet read by a person (Unverified).'
