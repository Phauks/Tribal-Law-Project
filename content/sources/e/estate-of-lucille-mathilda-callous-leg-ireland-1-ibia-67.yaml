notes: 'Indigo Book citation: Estate of Lucille Mathilda Callous Leg Ireland, 1 IBIA 67 (1971). Decision of the Interior Board of Indian Appeals, listed in the Board''s chronological index. Name from the decision''s cover sheet; date (March 19, 1971) from the decision''s own date. Cover sheet notes: Also published at 78 Interior Decisions 66; Related Board case: 6 IBIA 120 Estate of Lucille Mathilda Callous Leg Ireland Decided March 19, 1971 IBIA 71-6 Indian Probate: Rehearing: Generally Regardless of procedural technicalities involved in the adjudication of petitions for rehearing in administrative proceedings, administrative tribunals should give the same priority toward securing a "just result" as is required of the courts in their proceedings. Indian Probate: Hearing Examiner In the course of conducting an administrative proceeding, the Hearing Examiner should not assume the role of an adversary or advocate; but he owes a duty, as judge and inquisitor, particularly when a party is not represented by counsel, to elicit for the record all the material facts, both favorable and unfavorable, bearing on the contentions of that party. Indian Probate: Code of Federal Regulations: Interpretation and Construction The requirement of clear and convincing proof of a promise to pay for care and support, under 25 CFR 15.23(d), may be fulfilled by oral testimony without the corroboration of documentary evidence. Indian Probate: Administrative Procedure Act: Applicability to Indian Probate The requirement of the Administrative Procedure Act, that all decisions of an Examiner shall include a statement of findings and conclusions, and the reasons or basis therefor, on all the material issues of fact, law, or discretion presented on the record, is mandatory and applicable to all decisions of Examiners in Indian probate proceedings. 1 IBIA 67. Generated by scripts/law/ibia_decisions.py, with the nations matched by name in the decision''s name; not yet read by a person (Unverified).