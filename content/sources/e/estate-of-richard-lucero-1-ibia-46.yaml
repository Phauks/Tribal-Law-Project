notes: 'Indigo Book citation: Estate of Richard Lucero, 1 IBIA 46 (1970). Decision of the Interior Board of Indian Appeals, listed in the Board''s chronological index. Name from the decision''s cover sheet; date (December 28, 1970) from the decision''s own date. Cover sheet notes: Judicial review of this case: Dismissed, Vaile v. Morton, No. 9585 (W.D. Wash. Jan. 14, 1972) Affirmed, No. 72-1437 (9th Cir. Feb. 26, 1974); Earlier judicial case: Affirmed, Vaile v. Udall, Civil No. 6808 (W.D. Wash. May 12, 1967) Estate of Richard Lucero IBIA 71-3 Decided December 28, 1970 Indian Lands: Descent and Distribution: Wills Where the evidence in a hearing record clearly shows that the proponents have established a prima facie case of the validity of a will and the contestants have shown only opportunity for undue influence without presenting any evidence of the exercise of undue influence and failed to establish testamentary incapacity of the testator at the time of execution, the finding of validity of the will by the Examiner of Inheritance will be upheld on appeal. Indian Lands: Descent and Distribution: Appeals: Generally The "law of the case" doctrine is as applicable to proceedings before trial and appellate administrative tribunals as it is to proceedings before trial and appellate courts, in cases where the ingredients comprising the elements of the doctrine are present. This doctrine holds that a decision on a legal issue or issues by an appellate court establishes the "law of the case" and must be followed in all subsequent proceedings in the same case in the trial court, or on a later appeal in the appellate court, unless the evidence in a subsequent trial is substantially different, controlling authority has since made a contrary decision of the law applicable to such issues, or the decision was clearly erroneous and would work a manifest injustice. Indian Lands: Descent and Distribution: Appeals: Final Decision When, upon review of the proceedings in the probate o