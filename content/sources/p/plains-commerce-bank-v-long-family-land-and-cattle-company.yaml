case_box:
  background: |-
    Ronnie and Lila Long, members of the Cheyenne River Sioux Tribe, ran the Long Family Land and Cattle Company on the reservation. For years they borrowed from Plains Commerce Bank, a non-Indian bank located off the reservation. After loan troubles, the estate of a family member deeded fee land on the reservation to the Bank in place of foreclosure, and the Longs leased it back with an option to buy [@plains-commerce-bank-v-long-family-land-and-cattle-company, pp. 321-322]. In 1999 the Bank sold the land to non-Indians, and the Longs sued in the Cheyenne River Sioux Tribal Court. That court took jurisdiction and awarded them damages and the right to buy part of the land [@plains-commerce-bank-v-long-family-land-and-cattle-company, pp. 320, 322].
  question: |-
    Does a Tribal court have jurisdiction over a discrimination claim by Tribal-member-owned company against a non-Indian bank concerning the bank's sale of fee land it owned on the reservation?
  holding: |-
    No. The Court held that *Montana* does not permit Tribal regulation of the sale of non-Indian fee land, so the Tribal court lacked jurisdiction over the discrimination claim; it also held the bank had standing to challenge Tribal-court jurisdiction.
  quotes:
  - text: "*Montana* and its progeny permit tribal regulation of nonmember conduct inside the reservation that implicates the tribe’s sovereign interests."
    pinpoint: "p. 332"
  - text: "The Bill of Rights does not apply to Indian tribes."
    pinpoint: "p. 337"
  treatment: |-
    *United States v. Bryant* (2016) cites *Plains Commerce Bank* for the point that the Sixth Amendment does not apply in Tribal-court proceedings. [@united-states-v-bryant]
  topics:
  - "Tribal courts"
  - "Civil jurisdiction"
  reading:
    title: "*Plains Commerce Bank v. Long Family Land & Cattle Co.* (2008)"
    text: |-
      Even where a nonmember has consensual dealings with members, Tribal jurisdiction must relate to those dealings and to Tribal sovereign interests.
subjects: [jurisdiction, tribal-courts, land]
