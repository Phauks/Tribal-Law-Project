notes: 'Indigo Book citation: Reclamation Projects Authorization and Adjustment Act of 1992, Pub. L. No. 102-575, 106 Stat. 4600 (1992). The Act enacted the San Carlos Apache Tribe Water Rights Settlement Act of 1992 (1992); enacted the Ute Indian Rights Settlement Act of 1992 (1992), as Table 1 of the Congressional Research Service''s report R44148 (Dec. 3, 2024) lists it. Statutes at Large granule STATUTE-106-Pg4600 on GovInfo, found by scripts/law/water_settlements.py; nobody has checked the record against the Act yet (Unverified).'
