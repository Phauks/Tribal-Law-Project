notes: 'Indigo Book citation: An act to require the Secretary of Commerce to convey to the Commonwealth of Massachusetts the National Marine Fisheries Service laboratory located on Emerson Avenue in Gloucester, Massachusetts, Pub. L. No. 104-91, 110 Stat. 7 (1996). The Act amended the Yavapai-Prescott Indian Tribe Water Rights Settlement Act of 1994 (1994), as Table 1 of the Congressional Research Service''s report R44148 (Dec. 3, 2024) lists it. Statutes at Large granule STATUTE-110-Pg7 on GovInfo, found by scripts/law/water_settlements.py; nobody has checked the record against the Act yet (Unverified).'
