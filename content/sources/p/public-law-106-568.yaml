notes: 'Indigo Book citation: Omnibus Indian Advancement Act, Pub. L. No. 106-568, 114 Stat. 2868 (2000). Statutes at Large, volume 114, pages 2868-2943 (STATUTE-114-Pg2868 on GovInfo). Enacted 26 sections of Title 25 of the United States Code in force in the 2024 edition. Parts of it have their own short titles: American Indian Education Foundation Act of 2000; Graton Rancheria Restoration Act; Hawaiian Homelands Homeownership Act of 2000; Indian Employment, Training, and Related Services Demonstration Act Amendments of 2000; Native American Laws Technical Corrections Act of 2000; Navajo Nation Trust Land Leasing Act of 2000; Shawnee Tribe Status Act of 2000; Torres-Martinez Desert Cahuilla Indians Claims Settlement Act. The stored copy is that slip of the Statutes at Large. Generated by scripts/law/title_25_acts.py from Title 25''s source credits and notes and GovInfo''s metadata; Unverified.'
