notes: 'Indigo Book citation: Northwestern New Mexico Rural Water Projects Act (Navajo-Gallup Water Supply Project and Navajo Nation water rights), Pub. L. No. 111-11, 123 Stat. 991 (2009). The Act enacted the Northwestern New Mexico Rural Water Projects Act (Navajo-Gallup Water Supply Project and Navajo Nation water rights) (2009); enacted the Shoshone-Paiute Tribes of the Duck Valley Reservation Water Rights Settlement Act (2009), as Table 1 of the Congressional Research Service''s report R44148 (Dec. 3, 2024) lists it. Statutes at Large granule STATUTE-123-Pg991 on GovInfo, found by scripts/law/water_settlements.py; nobody has checked the record against the Act yet (Unverified).'
