notes: 'Indigo Book citation: 1997 Emergency Supplemental Appropriations Act for Recovery from Natural Disasters, and for Overseas Peacekeeping Efforts, Including Those in Bosnia, Pub. L. No. 105-18, 111 Stat. 158 (1997). The Act amended the San Carlos Apache Tribe Water Rights Settlement Act of 1992 (1992), as Table 1 of the Congressional Research Service''s report R44148 (Dec. 3, 2024) lists it. Statutes at Large granule STATUTE-111-Pg158 on GovInfo, found by scripts/law/water_settlements.py; nobody has checked the record against the Act yet (Unverified).'
