notes: 'The routes Congress designated as the Trail of Tears National Historic Trail: the land and water routes of the Cherokee removal of 1837 to 1839 (Benge, Bell, Northern, Hildebrand, Taylor, Whiteley-Drane, Water, Overland Water, Roundup and Disbandment routes), drawn as 2,006 line pieces. The website draws the "Removal routes" map layer from them, joined into one line set per route (site/tools/build-historic-maps.mjs). Other nations'' removals are not in this layer. The downloaded lines are kept in the project''s bucket under historic-maps/park-service-trail-of-tears/.'
