notes: 'Indigo Book citation: Fallon Paiute Shoshone Indian Tribes Water Rights Settlement Act of 1990, Pub. L. No. 101-618, 104 Stat. 3289 (1990). The Act enacted the Fallon Paiute Shoshone Indian Water Rights Settlement Act of 1990 (1990); enacted the Truckee-Carson-Pyramid Lake Water Rights Settlement Act (1990), as Table 1 of the Congressional Research Service''s report R44148 (Dec. 3, 2024) lists it. Statutes at Large granule STATUTE-104-Pg3289 on GovInfo, found by scripts/law/water_settlements.py; nobody has checked the record against the Act yet (Unverified).'
