notes: 'Indigo Book citation: Augustus F. Hawkins-Robert T. Stafford Elementary and Secondary School Improvement Amendments of 1988, Pub. L. No. 100-297, 102 Stat. 130. Statutes at Large, volume 102, pages 130-431 (STATUTE-102-Pg130 on GovInfo). Enacted 3 sections of Title 25 of the United States Code in force in the 2024 edition. Enacted 17 former sections of Title 25, since repealed, transferred or omitted. Parts of it have their own short titles: Indian Education Act of 1988; Indian Education Amendments of 1988; Tribally Controlled Schools Act of 1988. The stored copy is that slip of the Statutes at Large. Generated by scripts/law/title_25_acts.py from Title 25''s source credits and notes and GovInfo''s metadata; Unverified.'
