case_box:
  background: |-
    The Citizen Band Potawatomi Indian Tribe of Oklahoma ran a convenience store on land held in trust for it and sold cigarettes there without collecting the state cigarette tax. In 1987 the Oklahoma Tax Commission demanded $2.7 million in taxes for sales from 1982 to 1986. The Tribe sued in federal court to stop the assessment, and the Commission counterclaimed to collect the tax [@oklahoma-tax-commission-v-citizen-band-potawatomi-indian-tribe, pp. 507-508].
  question: |-
    Did the Nation waive its sovereign immunity from the State's counterclaim to collect cigarette taxes by suing to enjoin the tax assessment?
  holding: |-
    No. The Court held that Tribal sovereign immunity barred the State's counterclaim absent clear waiver or congressional abrogation, but that the State could tax sales to nonmembers and had other remedies, including agreements with the Tribe.
  quotes:
  - text: "Suits against Indian tribes are thus barred by sovereign immunity absent a clear waiver by the tribe or congressional abrogation."
    pinpoint: "p. 509"
  - text: "There is no doubt that sovereign immunity bars the State from pursuing the most efficient remedy, but we are not persuaded that it lacks any adequate alternatives."
    pinpoint: "p. 514"
  - text: "States may also enter into agreements with the tribes to adopt a mutually satisfactory regime for the collection of this sort of tax."
    pinpoint: "p. 514"
  treatment: |-
    Reaffirmed in *Kiowa* (1998) and *Bay Mills* (2014). [@michigan-v-bay-mills-indian-community]
  topics:
  - "Dispute resolution and arbitration"
  - "Sovereign immunity"
  reading:
    title: "*Oklahoma Tax Commission v. Citizen Band Potawatomi Indian Tribe of Oklahoma* (1991)"
    text: |-
      Sets the "clear waiver" standard, and expressly points to negotiated Tribal-state agreements as the alternative to litigation.
subjects: [sovereign-immunity, taxation]
