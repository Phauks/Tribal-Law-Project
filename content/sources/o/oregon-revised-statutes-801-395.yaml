citation:
  type: legislation
  title: “Police officer.” “Police officer” includes a member of the Oregon State Police, a sheriff, a deputy sheriff, a city police officer, an authorized tribal police officer as defined in ORS 181A.940, a police officer commissioned by a university under ORS 352.121 or 353.125, a Port of Portland peace officer, a reserve officer as defined in ORS 133.005 or a law enforcement officer employed by a service district established under ORS 451.410 to 451.610 for the purpose of law enforcement services
