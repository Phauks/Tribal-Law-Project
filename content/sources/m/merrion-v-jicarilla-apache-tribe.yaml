case_box:
  background: |-
    The Jicarilla Apache Reservation in northwestern New Mexico, set aside by executive order in 1887, is held entirely in trust for the Tribe, which is governed under a constitution adopted under the Indian Reorganization Act. Non-Indian companies held long-term leases to produce oil and gas there. The Tribe enacted a severance tax on oil and gas taken from Tribal lands, and 21 lessees sued to stop it [@merrion-v-jicarilla-apache-tribe, pp. 133-135].
  question: |-
    May the Jicarilla Apache Nation impose a severance tax on oil and gas extracted by non-Indian lessees from Tribal lands?
  holding: |-
    Yes. The Court held that the power to tax is an inherent attribute of Tribal sovereignty, not merely a landlord's contract right, and that the Nation did not surrender it by entering leases that were silent on taxation.
  quotes:
  - text: "The power to tax is an essential attribute of Indian sovereignty because it is a necessary instrument of self-government and territorial management."
    pinpoint: "p. 137"
  - text: "To presume that a sovereign forever waives the right to exercise one of its sovereign powers unless it expressly reserves the right to exercise that power in a commercial agreement turns the concept of sovereignty on its head . . . ."
    pinpoint: "p. 148"
  treatment: |-
    *Atkinson Trading Co. v. Shirley* (2001) limited *Merrion* to taxation on Tribal land and applied *Montana* to nonmember activity on fee land. [@atkinson-trading-company-v-shirley]
  topics:
  - "Civil jurisdiction"
  reading:
    title: "*Merrion v. Jicarilla Apache Tribe* (1982)"
    text: |-
      Teaches that commercial agreements do not silently waive sovereign powers.
subjects: [taxation, government]
