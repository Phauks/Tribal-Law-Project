case_box:
  background: |-
    In treaties of 1832 and 1833, the United States promised the Creek Nation, forced from Georgia and Alabama, a permanent home in what became Oklahoma and that no state would pass laws to govern it [@mcgirt-v-oklahoma, p. 897]. Jimcy McGirt, an enrolled member of the Seminole Nation of Oklahoma, was convicted in Oklahoma state court of serious sexual offenses committed within the Creek Reservation's historic boundaries. He argued that the Major Crimes Act left his prosecution to the federal government [@mcgirt-v-oklahoma, p. 898].
  question: |-
    Does land reserved for the Muscogee (Creek) Nation since the 19th century remain "Indian country" for purposes of the Major Crimes Act?
  holding: |-
    Yes. The Court held that Congress never disestablished the Creek Reservation, so it remains Indian country under the Major Crimes Act, and Oklahoma lacked jurisdiction to prosecute McGirt, a Native person, for crimes committed there.
  quotes:
  - text: "Today we are asked whether the land these treaties promised remains an Indian reservation for purposes of federal criminal law."
    pinpoint: "p. 897-898"
  - text: "To determine whether a tribe continues to hold a reservation, there is only one place we may look: the Acts of Congress."
    pinpoint: "p. 903"
  - text: "Because Congress has not said otherwise, we hold the government to its word."
    pinpoint: "p. 898"
  treatment: |-
    *Oklahoma v. Castro-Huerta* (2022) held that States have concurrent jurisdiction over crimes by non-Indians against Indians in Indian country, limiting the practical reach of *McGirt*. [@oklahoma-v-castro-huerta]
  topics:
  - "Criminal jurisdiction"
  reading:
    title: "*McGirt v. Oklahoma* (2020)"
    text: |-
      Reservation status determines the territorial scope of a nation's jurisdiction; after *McGirt*, eastern Oklahoma nations expanded court systems and intergovernmental agreements.
subjects: [criminal, jurisdiction, land, treaties]
