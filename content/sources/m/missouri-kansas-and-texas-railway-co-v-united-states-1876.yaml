notes: 'Full citation: Missouri, Kan. & Tex. Ry. Co. v. United States, 92 U.S. 760 n. (1876). Official report scan: https://tile.loc.gov/storage-services/service/ll/usrep/usrep092/usrep092760/usrep092760.pdf. Decided in a note at the end of Leavenworth, Lawrence & Galveston Railroad Co. v. United States, 92 U.S. 733 (1876), which it follows: the claimed land grant lay within the Osage reservation. The report prints no date for the note case; the decision date is the Database''s, the day the Court decided Leavenworth (Supreme Court Library table of decision dates). Not yet read by a person.'
