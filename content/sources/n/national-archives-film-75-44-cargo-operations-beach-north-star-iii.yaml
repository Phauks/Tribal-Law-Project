notes: 'Indigo Book citation: Cargo Operations - Beach, "North Star III" (Bureau of Indian Affairs records n.d.) (motion picture), National Archives Identifier 12715, RG 75, item 75.44. Digitized by the National Archives; the project''s copy is its file, unchanged (153,404,997 bytes, SHA-256 bebcd7d9f52260fa6e5b9167dc46b9add8372186de28a7fae8830f3a43d32ddc). The film does not name its maker on screen. Thirty frames read across the film show cargo unloaded from landing craft onto a beach and hauled to a village by tractor. Chosen as a federal Indian policy item (the Bureau''s North Star III resupply of Alaska villages) by scripts/law/national_archives_films.py; ceremony films and children''s recordings in the same series are left out (CARE principles). Not yet watched or heard in full by a person (Unverified).'
