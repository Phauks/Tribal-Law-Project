notes: 'Indigo Book citation: Current Indian Legislation (U.S. Department of the Interior, Bureau of Indian Affairs 1973) (motion picture), National Archives Identifier 12688, RG 75, item 75.11. The National Archives describes it: "DOCUMENTARY: On new legislation which has gone into effect to aid Indians. In 1973, Congress passes Johnson-O''Malley Act and Indian Financing Act. These Acts gives Indians the right to govern their own land as well as their own people." Not digitized: the National Archives holds the film at College Park, where it can be viewed or copied on request. Chosen as a federal Indian policy item (the Indian Financing Act and Johnson-O''Malley contracts (1973)) by scripts/law/national_archives_films.py; ceremony films and children''s recordings in the same series are left out (CARE principles). Not yet watched or heard in full by a person (Unverified).'
