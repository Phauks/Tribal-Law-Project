notes: 'Indigo Book citation: Film Bulletin Number 1 (Bureau of Indian Affairs records 1973) (sound recording), National Archives Identifier 101899, RG 75, item 75-GENERALa-1. Not digitized: the National Archives holds the recording at College Park, where it can be viewed or copied on request. Chosen as a federal Indian policy item (Indian legislation (1973)) by scripts/law/national_archives_films.py; ceremony films and children''s recordings in the same series are left out (CARE principles). Not yet watched or heard in full by a person (Unverified).'
