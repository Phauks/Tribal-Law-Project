case_box:
  background: |-
    In 1982 Leroy Sage, a Crow child, was struck by a motorcycle in the parking lot of a public school on state land within the Crow Reservation. He sued the Lodge Grass School District in the Crow Tribal Court and won a default judgment. The school district and its insurer, National Farmers Union, then asked a federal court to block enforcement, arguing that the Tribal court had no jurisdiction over them [@national-farmers-union-insurance-companies-v-crow-tribe, p. 847].
  question: |-
    May a non-Indian party go directly to federal court to challenge a Tribal court's civil jurisdiction, and must it first exhaust Tribal court remedies?
  holding: |-
    The Court held that whether a Tribal court has exceeded its jurisdiction is a federal question under 28 U.S.C. § 1331. But the question should ordinarily be decided first by the Tribal court itself, so Tribal remedies must be exhausted before a federal court considers it.
  quotes:
  - text: "Congress is committed to a policy of supporting tribal self-government and self-determination."
    pinpoint: "p. 856"
  - text: "Exhaustion of tribal court remedies, moreover, will encourage tribal courts to explain to the parties the precise basis for accepting jurisdiction, and will also provide other courts with the benefit of their expertise in such matters in the event of further judicial review."
    pinpoint: "p. 857"
  treatment: |-
    *Strate v. A-1 Contractors* (1997) and *Nevada v. Hicks* (2001) recognize exceptions where Tribal jurisdiction is plainly lacking. [@strate-v-a-1-contractors]
  topics:
  - "Exhaustion of Tribal remedies"
  - "Tribal courts"
  - "Civil jurisdiction"
  reading:
    title: "*National Farmers Union Insurance Cos. v. Crow Tribe of Indians* (1985)"
    text: |-
      Creates the Tribal-exhaustion doctrine: Tribal courts get the first opportunity to decide their own jurisdiction.
