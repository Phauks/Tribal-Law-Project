notes: 'Indigo Book citation: Washington Report (Bureau of Indian Affairs records 1966) (motion picture), National Archives Identifier 12716, RG 75, item 75.45. The National Archives describes it: "Senator Lee Metcalf of Montana discusses new Job Corps Conservation Centers in Montana, including the Kicking Horse Center due for dedication and two others under construction." Not digitized: the National Archives holds the film at College Park, where it can be viewed or copied on request. Chosen as a federal Indian policy item (Job Corps conservation centers in Montana (1966)) by scripts/law/national_archives_films.py; ceremony films and children''s recordings in the same series are left out (CARE principles). Not yet watched or heard in full by a person (Unverified).'
