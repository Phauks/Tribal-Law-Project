notes: 'Every state and territory of the United States from September 3, 1783 to December 31, 2000, each shape with the day it began and ended, the change that made it and the source the Atlas cites for that change (often the Statutes at Large). The website draws the "Borders over time" map layer from the generalized file (site/tools/build-historic-maps.mjs); a shape still standing on December 31, 2000 is shown as standing today. The Library''s site sometimes asks a person to pass a check before a download, so the file may need to be downloaded by hand. The downloaded file is kept in the project''s bucket under historic-maps/newberry-states-and-territories/.'
