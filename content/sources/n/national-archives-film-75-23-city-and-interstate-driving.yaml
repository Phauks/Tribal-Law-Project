notes: 'Indigo Book citation: City and Interstate Driving (U.S. Department of the Interior, Bureau of Indian Affairs n.d.) (motion picture), National Archives Identifier 12699, RG 75, item 75.23. The National Archives describes it: "TRAINING FILM: Shows Indian drivers how to drive safely on cityroadways as well as interstates." Not digitized: the National Archives holds the film at College Park, where it can be viewed or copied on request. Chosen as a federal Indian policy item (a Bureau driver training film) by scripts/law/national_archives_films.py; ceremony films and children''s recordings in the same series are left out (CARE principles). Not yet watched or heard in full by a person (Unverified).'
