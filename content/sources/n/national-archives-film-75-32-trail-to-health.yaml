notes: 'Indigo Book citation: Trail to Health (Bureau of Indian Affairs records n.d.) (motion picture), National Archives Identifier 12706, RG 75, item 75.32. The National Archives describes it: "PROMOTIONAL FILM:  Urges Native Americans to recognize symptoms and seek treatment for tuberculosis. Presents drama of man who falls victim to disease, is diagnosed, and treated." Not digitized: the National Archives holds the film at College Park, where it can be viewed or copied on request. Chosen as a federal Indian policy item (a Bureau tuberculosis film) by scripts/law/national_archives_films.py; ceremony films and children''s recordings in the same series are left out (CARE principles). Not yet watched or heard in full by a person (Unverified).'
