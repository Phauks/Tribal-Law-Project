notes: 'Indigo Book citation: Geographic Composition of the Health Service Delivery Areas (HSDA) Established by Regulations of the Indian Health Service, 53 Fed. Reg. 32,460 (Aug. 25, 1988). The Indian Health Service''s table of the counties in each reservation''s health service delivery area (pages 32460-32463 of the issue). Note 3 to the table, on page 32463, reads: "Restored by Court Order issued December 22, 1983, in Tillie Hardwick v. U.S., Civil No. C-79-1910-SW, U.S. District Court for the Northern District of California." The note marks 17 California rancherias: Big Valley, Blue Lake, Buena Vista, Chicken Ranch and Cloverdale (page 32460); Elk Valley and Greenville (32461); Mooretown, North Fork, Picayune, Pinoleville, Potter Valley, Quartz Valley, Redding, Redwood Valley, Rohnerville and Smith River (32462). Found by a GovInfo full-text search of the Federal Register for "Tillie Hardwick" and read on the page images of the issue on Nov. 27, 2026 (the text layer misreads several of the note marks as 8). Cited by scripts/tribes/recognition_basis.py.'
