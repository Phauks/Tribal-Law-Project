  basis_note: The terms of use allow the codes in web-based systems "provided that" attribution is given to iso639-3.sil.org, the codes are not modified, and the system "does not provide a means to redistribute the code set". The site keeps only the codes of the languages nations' records name, each cited here, and links to the code's page at iso639-3.sil.org.
