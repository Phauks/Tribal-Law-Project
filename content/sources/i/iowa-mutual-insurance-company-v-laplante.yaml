case_box:
  background: |-
    Edward LaPlante, a Blackfeet member, was hurt driving a cattle truck for a ranch owned by Blackfeet members on the Blackfeet Reservation. He and his wife sued the ranch, and its insurer Iowa Mutual for bad-faith refusal to settle, in the Blackfeet Tribal Court. While that case was pending, Iowa Mutual sued in federal court, on the basis of diversity of citizenship, for a declaration that its policies did not cover the injury [@iowa-mutual-insurance-company-v-laplante, pp. 11-13].
  question: |-
    Does the Tribal-exhaustion requirement apply when federal jurisdiction rests on diversity of citizenship?
  holding: |-
    Yes. The Court held that federal policy supporting Tribal self-government requires exhaustion of Tribal remedies in diversity cases too. Civil jurisdiction over non-Indian activities on reservation lands presumptively lies in Tribal courts. Unless the Tribal court lacked jurisdiction, its resolution of issues may not be relitigated in federal court.
  quotes:
  - text: "Tribal authority over the activities of non-Indians on reservation lands is an important part of tribal sovereignty."
    pinpoint: "p. 18"
  - text: "Civil jurisdiction over such activities presumptively lies in the tribal courts unless affirmatively limited by a specific treaty provision or federal statute."
    pinpoint: "p. 18"
  - text: "Unless a federal court determines that the Tribal Court lacked jurisdiction, however, proper deference to the tribal court system precludes relitigation of issues raised by the LaPlantes' bad-faith claim and resolved in the Tribal Courts."
    pinpoint: "p. 19"
  treatment: |-
    The "presumptively lies" language was narrowed for nonmembers on non-Indian land in *Strate v. A-1 Contractors* (1997). [@strate-v-a-1-contractors]

    Relied on in *AT&T Corp. v. Coeur d'Alene Tribe* (9th Cir. 2002) for the rule that federal courts may not relitigate issues a Tribal court with jurisdiction has decided. [@att-corporation-v-coeur-dalene-tribe]
  topics:
  - "Recognition of Tribal judgments (comity)"
  - "Enforcement of awards, orders and judgments"
  - "Exhaustion of Tribal remedies"
  - "Tribal courts"
  - "Civil jurisdiction"
  reading:
    title: "*Iowa Mutual Insurance Co. v. LaPlante* (1987)"
    text: |-
      Supports finality of Tribal-court decisions: once a Tribal court with jurisdiction decides issues, federal courts defer.
subjects: [jurisdiction, tribal-courts]
