notes: 'The 298 areas on the 1978 map of the lands the Indian Claims Commission found each nation held (its "judicially established" areas), each with the map''s area number and the nation or nations it names. These are the Commission''s findings in claims against the United States, not a nation''s own account of its homeland, and the website shows them as dashed, credited findings rather than borders (site/tools/build-historic-maps.mjs). The downloaded areas are kept in the project''s bucket under historic-maps/park-service-indian-land-areas-1978/.'
