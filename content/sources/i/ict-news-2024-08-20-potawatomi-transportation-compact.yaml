notes: 'Names the four nations with Tribal Transportation Self-Governance Program compacts by August 2024: the Cherokee Nation (the first, 2022), Ohkay Owingeh, the Citizen Potawatomi Nation and the Forest County Potawatomi Community. The Department of Transportation''s own program pages refused requests from the cloud (HTTP 403), so news reports stand in for its list. Private copy research/captures/self-governance/ict-news-2024-08-20-potawatomi-transportation-compact.html.'
